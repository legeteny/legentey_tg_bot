name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Write .env
        run: |
          cat > .env <<EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          POLL_TIMEOUT_SECONDS=${{ secrets.POLL_TIMEOUT_SECONDS }}
          ADMIN_CHAT_ID=${{ secrets.ADMIN_CHAT_ID }}
          GIT_COMMIT=$(git rev-parse --short HEAD)
          GIT_COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          EOF

      - name: Build and restart container
        timeout-minutes: 20
        run: docker compose up -d --build
