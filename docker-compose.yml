services:
  tgbot:
    build: .
    container_name: legentey_tg_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.db
      QUOTE_API_URL: http://quote-api:3000
    volumes:
      - ./data:/data
    depends_on:
      - quote-api

  quote-api:
    build: https://github.com/legeteny/quote-api.git#master
    container_name: legentey_quote_api
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
    # quote-api can end up alive but unable to reach Telegram (avatars come from
    # getFileLink), and it builds its Telegram client once at startup with no retry
    # — so the process never recovers on its own. "restart" only reacts to a process
    # exiting, which never happens here, hence the healthcheck plus autoheal below.
    #
    # Neither curl is given -f: a non-2xx status still proves the connection got
    # through, and it is reachability, not the status code, that is being tested.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sS -o /dev/null --max-time 5 http://127.0.0.1:3000/
          && curl -sS -o /dev/null --max-time 10 https://api.telegram.org/
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    labels:
      autoheal: "true"
    deploy:
      resources:
        limits:
          memory: 1G

  # Restarts containers Docker has marked unhealthy — Docker itself never does.
  # Scoped by label so it only ever touches quote-api, not everything on the host.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: legentey_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
