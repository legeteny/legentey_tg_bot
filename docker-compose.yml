services:
  tgbot:
    build: .
    container_name: legentey_tg_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.db
      QUOTE_API_URL: http://quote-api:3000
    volumes:
      - ./data:/data
    depends_on:
      - quote-api

  quote-api:
    build: https://github.com/legeteny/quote-api.git#master
    container_name: legentey_quote_api
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
    deploy:
      resources:
        limits:
          memory: 1G
